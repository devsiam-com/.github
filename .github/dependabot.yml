version: 2
updates:
  # ทุกอย่างรวมเป็น 1 PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
