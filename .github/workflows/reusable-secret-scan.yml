name: reusable-secret-scan

# Usage from another repo:
#   jobs:
#     secret-scan:
#       uses: devsiam-com/.github/.github/workflows/reusable-secret-scan.yml@main

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.21.2"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks-version }}/gitleaks_${{ inputs.gitleaks-version }}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks detect --source . --redact --verbose
